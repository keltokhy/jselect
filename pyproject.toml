[project]
name = "jev-select"
version = "0.1.0"
description = "Select useful, source-linked evidence for an AI task within a token budget"
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaled Eltokhy" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pathspec>=0.12", "tiktoken>=0.8"]

[project.scripts]
jselect = "jselect.cli:cli"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jselect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
