[project]
name = "jev-select"
version = "0.1.1"
description = "Select useful, source-linked evidence for an AI task within a token budget"
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaled Eltokhy" }]
requires-python = ">=3.10"
dependencies = [
    "jevkit-runtime>=0.1.0,<0.2.0","httpx>=0.27", "pathspec>=0.12", "tiktoken>=0.8"]
keywords = ["cli", "retrieval", "context", "agents", "jev", "semantic search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/keltokhy/jselect"
Documentation = "https://github.com/keltokhy/jselect#readme"
Issues = "https://github.com/keltokhy/jselect/issues"

[project.scripts]
jselect = "jselect.cli:cli"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jselect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
jevkit-runtime = { path = "../jevkit-core", editable = true }
